services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: present_studio
      POSTGRES_USER: present_studio
      POSTGRES_PASSWORD: present_studio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U present_studio -d present_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://present_studio:present_studio_password@postgres:5432/present_studio
      JWT_SECRET: change-this-in-production
      PUBLIC_BASE_URL: http://127.0.0.1:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
