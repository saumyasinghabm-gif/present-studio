name: Deploy SnapKey Studio

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: snapkey-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 15m

          script: |
            set -e

            SOURCE_DIR="${{ secrets.SERVER_PROJECT_PATH }}"
            PROD_DIR="/srv/projects/present-studio"
            BACKUP_ROOT="/srv/projects/present-studio-backups"

            echo "=== UPDATE SOURCE REPO ==="
            cd "$SOURCE_DIR"
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            echo "Deploying commit:"
            git log -1 --oneline

            echo "=== CREATE BACKUP ==="
            STAMP=$(date +%Y%m%d-%H%M%S)
            mkdir -p "$BACKUP_ROOT/$STAMP"

            cp -a "$PROD_DIR/backend" "$BACKUP_ROOT/$STAMP/backend"
            cp -a "$PROD_DIR/frontend" "$BACKUP_ROOT/$STAMP/frontend"
            cp "$PROD_DIR/.env" "$BACKUP_ROOT/$STAMP/.env"
            cp "$PROD_DIR/docker-compose.yml" "$BACKUP_ROOT/$STAMP/docker-compose.yml"

            echo "Backup created: $BACKUP_ROOT/$STAMP"

            echo "=== DEPLOY BACKEND + FRONTEND ==="
            rm -rf "$PROD_DIR/backend"
            rm -rf "$PROD_DIR/frontend"

            cp -a "$SOURCE_DIR/backend" "$PROD_DIR/backend"
            cp -a "$SOURCE_DIR/frontend" "$PROD_DIR/frontend"

            echo "=== UPDATE COMPOSE FILE ==="
            cp "$SOURCE_DIR/docker-compose.yml" "$PROD_DIR/docker-compose.yml"

            echo "=== VALIDATE COMPOSE ==="
            cd "$PROD_DIR"

            docker compose \
              --env-file .env \
              -p present-studio-prod \
              config --quiet

            echo "=== BUILD BACKEND ==="
            docker compose \
              --env-file .env \
              -p present-studio-prod \
              build backend

            echo "=== RECREATE BACKEND ==="
            docker compose \
              --env-file .env \
              -p present-studio-prod \
              up -d --force-recreate backend

            echo "=== CONTAINER STATUS ==="
            docker compose \
              --env-file .env \
              -p present-studio-prod \
              ps

            echo "=== WAIT FOR BACKEND ==="

            HEALTH_OK=false

            for i in $(seq 1 30); do
              echo "Health check attempt $i/30..."

              if curl \
                --silent \
                --show-error \
                --fail \
                --max-time 5 \
                http://127.0.0.1:18473/api/health; then

                echo
                echo "Backend is healthy."
                HEALTH_OK=true
                break
              fi

              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Backend failed health check."

              echo "=== BACKEND LOGS ==="
              docker compose \
                --env-file .env \
                -p present-studio-prod \
                logs --tail=100 backend

              exit 1
            fi

            echo "=== PUBLIC HEALTH CHECK ==="

            PUBLIC_OK=false

            for i in $(seq 1 15); do
              if curl \
                --silent \
                --show-error \
                --fail \
                --max-time 10 \
                https://studio.snapkey.in/api/health; then

                echo
                echo "Public endpoint is healthy."
                PUBLIC_OK=true
                break
              fi

              echo "Public health attempt $i/15 failed; retrying..."
              sleep 2
            done

            if [ "$PUBLIC_OK" != "true" ]; then
              echo "Public health check failed."
              exit 1
            fi

            echo "=== FINAL STATUS ==="

            docker compose \
              --env-file .env \
              -p present-studio-prod \
              ps

            echo
            echo "Deployment successful."
