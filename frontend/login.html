<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Present Studio Cloud - Login</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-copy">
        <p class="eyebrow">Cloud presentation studio</p>
        <h1>Create the deck. Control the room.</h1>
        <p>Build presentations on a canvas, save them to the cloud, share an audience link, and present live.</p>
      </section>
      <form class="auth-card" id="loginForm">
        <h2>Sign in</h2>
        <label>Email <input name="email" type="email" value="owner@presentstudio.local" required></label>
        <label>Password <input name="password" type="password" value="password123" required></label>
        <button class="primary-button" type="submit">Open workspace</button>
        <p id="loginStatus" class="status-text"></p>
        <p class="helper-text">Run the FastAPI backend and open this page from http://127.0.0.1:8000/login.html</p>
      </form>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
