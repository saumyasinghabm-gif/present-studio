<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SnapKey Studio — Login</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260907-snapkey-login">
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-copy" aria-label="SnapKey Studio introduction">
        <a class="brand brand-light" href="/index.html" aria-label="SnapKey Studio home">
          <img class="login-brand-logo" src="/assets/snapkey.png" alt="" aria-hidden="true">
          <span>SnapKey Studio</span>
        </a>
        <div class="login-art-copy">
          <p class="eyebrow">SnapKey presentation studio</p>
          <h1>Create the deck.<br>Control the room.</h1>
          <p>Build presentations on a canvas, save them to the cloud, share an audience link, and present live.</p>
        </div>
        <div class="login-art-footer"><span>© 2026 SnapKey Studio</span><span>Thoughtful by design</span></div>
      </section>
      <section class="login-form-wrap" aria-label="Sign in">
        <form class="auth-card login-form-card" id="loginForm">
          <h2>Sign in</h2>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="primary-button full-button" type="submit">Open workspace</button>
          <p id="loginStatus" class="status-text" role="status" aria-live="polite"></p>
          <p class="auth-switch">New to SnapKey Studio? <a href="/signup.html">Create an account</a></p>
        </form>
      </section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/login.js?v=20260903-auth"></script>
  </body>
</html>
