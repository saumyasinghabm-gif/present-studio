<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Present Studio - Preview</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/preview.css">
  </head>
  <body class="present-page preview-page">
    <div class="present-loading" id="previewLoading">
      <div class="loading-spinner"></div>
      <p>Loading preview...</p>
    </div>
    <div class="present-error" id="previewError" hidden>
      <div class="error-icon">!</div>
      <h2>Unable to load preview</h2>
      <p id="previewErrorMessage">Something went wrong while loading the presentation.</p>
      <p>Press Esc to return to the editor.</p>
    </div>
    <main class="present-stage" id="previewStage" hidden>
      <span id="previewStatus" class="preview-status" aria-live="polite"></span>
      <div class="canvas-frame present-frame" id="previewFrame">
        <div class="present-media-layer" id="previewMedia" aria-hidden="true"></div>
        <canvas id="previewCanvas" width="1280" height="720" aria-label="Presentation preview"></canvas>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
    <script src="/js/fabric-patch.js?v=20260829-baseline"></script>
    <script src="/js/api.js"></script>
    <script src="/js/preview.js?v=20260904-keyboard-preview"></script>
  </body>
</html>
