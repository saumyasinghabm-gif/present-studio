<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaf Frame</title>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;">

  <div style="
    width:260px;
    height:180px;
    overflow:hidden;
    border-radius: 100% 0 100% 0;
    border:5px solid #4f7f52;
    transform:rotate(-10deg);
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    background:white;
  ">
    <img
      src="https://images.pexels.com/photos/414612/pexels-photo-414612.jpeg"
      alt="Frame Image"
      style="
        width:100%;
        height:100%;
        object-fit:cover;
        transform:rotate(10deg) scale(1.15);
      "
    >
  </div>

</body>
</html>
